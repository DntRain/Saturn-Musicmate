name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis --config src-tauri/tauri.windows.conf.json"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev \
            libpulse-dev \
            libjack-jackd2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows bundled Node
        if: matrix.platform == 'windows-latest'
        run: npm run prepare:windows-node

      - name: Prepare QQ API resources
        run: npm run prepare:qq-api

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Musicmate ${{ github.ref_name }}"
          releaseBody: |
            Musicmate ${{ github.ref_name }}

            Download the installer for your platform below.

            - **Windows**: `.exe` (NSIS installer)
            - **macOS**: `.dmg` (universal: Intel + Apple Silicon)
            - **Linux**: `.AppImage` or `.deb`

            > Windows installers include the local QQ Music sidecar service. Fill in QQ Music cookies in Settings before using online search or VIP preview.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
